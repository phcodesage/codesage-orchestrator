# Generated by scripts/build_profiles.py. Edit the templates or PROFILES there, not this file.
#
# codesage-orchestrator: Plus profile
# The root is the largest line item, so it runs on Luna. Astra is kept for one short, independent review.
#
# Project scope: <repo>/.codex/config.toml (Codex loads it for trusted projects only)
# Global scope:  merge these keys into ~/.codex/config.toml; do not overwrite that file.

# Root / orchestrator
model = "gpt-5.6-luna"
model_reasoning_effort = "max"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

# Used only by spawns that do not name a role; named roles pin their own model.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
