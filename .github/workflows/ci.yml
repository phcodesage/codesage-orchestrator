name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Profiles are regenerated
        run: python scripts/build_profiles.py --check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell wrapper
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          ./setup.sh --target "$RUNNER_TEMP/demo" --plan lite --yes
          python install.py doctor --target "$RUNNER_TEMP/demo"
      - name: PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\demo" | Out-Null
          .\setup.ps1 --target "$env:RUNNER_TEMP\demo" --plan lite --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python install.py doctor --target "$env:RUNNER_TEMP\demo"
